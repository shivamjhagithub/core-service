spring.application.name=CoreService
server.port=${SERVER_PORT:8082}

# ---------------------------------------------------------------------------
# Database - MySQL is the single primary datastore for every module
# ---------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/collegeerp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:20}
spring.datasource.hikari.pool-name=core-service-pool

# ---------------------------------------------------------------------------
# JPA - Flyway owns the schema, Hibernate only validates it
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# MySQL has no UUID column type. Hibernate would otherwise store keys as
# binary(16), which is compact but unreadable: you could not select a row by
# pasting an id from a log or an API response. char(36) keeps the database
# inspectable, which matters far more here than 20 bytes per key.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Store enums as varchar rather than MySQL's native ENUM type. A native ENUM
# bakes the constant list into the column, so adding one value would need an
# ALTER TABLE; NotificationType and friends grow with every feature.
spring.jpa.properties.hibernate.type.prefer_native_enum_types=false

# ---------------------------------------------------------------------------
# Flyway - every schema change is versioned
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------------------
# Security / JWT. JWT_SECRET has no default on purpose: the application must
# not start with a well-known signing key.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Platform operator created on an empty database. Leave the password unset and
# a random one is generated and logged once at startup.
app.bootstrap.admin.user-id=${BOOTSTRAP_ADMIN_USER_ID:MainAdmin001}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@college-erp.local}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:300}
app.rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_RPM:20}

# ---------------------------------------------------------------------------
# Redis - cache, refresh-token bookkeeping, OTP, rate limiting
# ---------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000
app.cache.provider=${CACHE_PROVIDER:redis}

# ---------------------------------------------------------------------------
# Kafka - asynchronous fan-out only (notifications, audit, email). Disable it
# and the monolith keeps working through in-process Spring events.
# ---------------------------------------------------------------------------
app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=core-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.CoreService.CoreService.*

# ---------------------------------------------------------------------------
# File storage - swap the provider without touching business modules
# ---------------------------------------------------------------------------
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local.base-path=${STORAGE_LOCAL_PATH:./storage}
app.storage.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE:26214400}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# ---------------------------------------------------------------------------
# Push notifications - architecture is present, provider is opt-in
# ---------------------------------------------------------------------------
app.push.enabled=${PUSH_ENABLED:false}
app.push.provider=${PUSH_PROVIDER:noop}

# ---------------------------------------------------------------------------
# Video conference provider abstraction
# ---------------------------------------------------------------------------
app.meeting.provider=${MEETING_PROVIDER:internal-webrtc}
app.meeting.join-url-template=${MEETING_JOIN_URL_TEMPLATE:}

# ---------------------------------------------------------------------------
# API documentation
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# ---------------------------------------------------------------------------
# JSON
# ---------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:false}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
server.error.include-message=never
