spring.application.name=CoreService-test

# In-memory database in MySQL compatibility mode. Flyway migrations are
# MySQL-specific, so Hibernate builds the schema for tests instead.
spring.datasource.url=jdbc:h2:mem:coreservice;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Mirror the production mappings so tests exercise the same column types.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Never point tests at the shared infrastructure.
app.cache.provider=memory
app.rate-limit.enabled=false
app.kafka.enabled=false
app.push.enabled=false
spring.docker.compose.enabled=false

jwt.secret=test-only-signing-key-not-used-outside-tests-0123456789
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

app.bootstrap.admin.user-id=TestAdmin001
app.bootstrap.admin.email=test-admin@college-erp.local
app.bootstrap.admin.password=test-admin-password

app.storage.provider=local
app.storage.local.base-path=${java.io.tmpdir}/core-service-test-storage
app.storage.max-file-size-bytes=26214400

logging.level.org.hibernate.SQL=warn
